<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alamanda Pass</title>
<meta name="apple-mobile-web-app-title" content="Alamanda Pass">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0B130C">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #0B130C; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; padding-top: env(safe-area-inset-top); box-sizing: border-box; background: #0B130C; }
  p { color: #E9ECE2; font: 16px/1.5 system-ui, sans-serif; padding: 24px; }
  /* Live QR scanner for the guard phone (Google's frame can't use the camera, this page can) */
  #scanner { position: fixed; inset: 0; z-index: 10; background: #0B130C; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; box-sizing: border-box; font: 16px/1.4 system-ui, sans-serif; color: #E9ECE2; }
  #scanner.on { display: flex; }
  #scanner .box { position: relative; width: min(88vw, 420px); aspect-ratio: 1; border-radius: 18px; overflow: hidden; border: 3px solid #D9B866; background: #000; }
  #scanner video { width: 100%; height: 100%; object-fit: cover; }
  #scanner .hint { color: #B9C6B3; text-align: center; }
  #scanner button { font: inherit; font-weight: 600; color: #0B130C; background: #E9ECE2; border: 0; border-radius: 999px; padding: 14px 28px; }
</style>
</head>
<body>
<!--
  Alamanda Visitor Pass home page.
  It shows the Google Apps Script app full screen, without Google's banner,
  and gives the app its logo when saved to an iPhone or Android home screen.
  The line below holds your web app link (it ends with /exec). Change it only if you make a brand-new deployment.
-->
<script>
var APP_LINK = 'https://script.google.com/macros/s/AKfycbwFpkPMXUCqSHsYxgSpAfiPlbAmcVa23l_j6p-GPCYTvFT1VYatAyLc4O1oIARhEXTR/exec';
</script>
<iframe id="app" title="Alamanda Visitor Pass" allow="camera; clipboard-write; web-share"></iframe>
<div id="scanner" role="dialog" aria-label="Scan visitor QR">
  <div class="box"><video id="cam" playsinline muted></video></div>
  <div class="hint" id="scanHint">Point the camera at the visitor's QR code</div>
  <button id="scanStop">Cancel</button>
</div>
<script>
  if (APP_LINK.indexOf('https://script.google.com/') !== 0) {
    document.body.innerHTML = '<p>Setup is not finished: paste the web app link into index.html.</p>';
  } else {
    // Pass links such as ?pass=ABC123, ?scan=ABC123 or ?mode=guard straight through to the app.
    document.getElementById('app').src = APP_LINK.replace(/[?#].*$/, '') + location.search;
  }

  // ---- Live scanner. The guard screen asks for it; the code found is sent back to the app. ----
  var scanFor = null, stream = null, timer = null;
  function fromApp(e) { try { return /(^|\.)googleusercontent\.com$/.test(new URL(e.origin).hostname); } catch (x) { return false; } }
  window.addEventListener('message', function (e) {
    if (!fromApp(e) || !e.data) return;
    if (e.data.type === 'alamanda-hello') e.source.postMessage({ type: 'alamanda-scanner' }, e.origin);
    if (e.data.type === 'alamanda-scan') openScanner(e.source, e.origin);
  });
  function loadJsQR(cb) {
    if (window.jsQR) return cb();
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; s.onload = cb; s.onerror = cb; document.head.appendChild(s);
  }
  function stopScanner() {
    clearInterval(timer); if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null;
    document.getElementById('scanner').classList.remove('on');
  }
  function openScanner(src, origin) {
    scanFor = { src: src, origin: origin };
    var hint = document.getElementById('scanHint'); hint.textContent = 'Point the camera at the visitor\'s QR code';
    document.getElementById('scanner').classList.add('on');
    loadJsQR(function () {
      if (!window.jsQR || !navigator.mediaDevices) { hint.textContent = 'This phone cannot scan here. Type the 6-letter code instead.'; return; }
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (s) {
        stream = s; var v = document.getElementById('cam'); v.srcObject = s; v.play();
        var c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently: true });
        timer = setInterval(function () {
          if (!v.videoWidth) return;
          var w = Math.min(720, v.videoWidth), h = Math.round(v.videoHeight * w / v.videoWidth);
          c.width = w; c.height = h; x.drawImage(v, 0, 0, w, h);
          var r = jsQR(x.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
          if (r && r.data) {
            stopScanner(); if (navigator.vibrate) navigator.vibrate(80);
            scanFor.src.postMessage({ type: 'alamanda-code', text: r.data }, scanFor.origin);
          }
        }, 200);
      }).catch(function () { hint.textContent = 'Camera blocked. Allow camera access for this site in the browser settings, then try again.'; });
    });
  }
  document.getElementById('scanStop').onclick = stopScanner;
</script>
</body>
</html>
